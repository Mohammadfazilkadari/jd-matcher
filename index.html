<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paste a job description and your resume to see skill match score and missing keywords."
    />
    <meta property="og:title" content="JD Matcher" />
    <meta
      property="og:description"
      content="Free, private resume vs JD skill matcher."
    />
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Apply the theme before the page renders; otherwise, a white flash appears upon refreshing.
      try {
        let t = localStorage.getItem("jdm:theme");
        if (
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* If storage is blocked then default light will remain. */
      }
    </script>
    <title>JD Matcher | Match your resume with any job description</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
